[tool.poetry]
name = "aiorwlock"
version = "1.6.0"
description = "Read write lock for asyncio."
authors = ["Nikolay Novik <nickolainovik@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/aio-libs/aiorwlock"
repository = "https://github.com/aio-libs/aiorwlock"
documentation = "https://github.com/aio-libs/aiorwlock"
keywords = ["aiorwlock", "lock", "asyncio"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
]

[tool.poetry.dependencies]
python = ">=3.11"

[tool.poetry.dev-dependencies]
bandit = "1.8.6"
mypy = "1.19.1"
pyroma = "5.0.1"
pytest-asyncio = "1.2.0"
pytest-cov = "7.1.0"
pytest = "8.4.2"
ruff = "0.17.3"
coverage = "^7.10.7"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.mypy]
[tool.mypy-pytest]
ignore_missing_imports = true
